; Phantom Pact settings. Open in Notepad, change, save, then start the game.

; Host  = your world: your partner joins you.
; Guest = you join the host.
; Off   = Phantom Pact stays off (single-player as normal).
Role = Guest

; How the two PCs connect:
;   Tailscale = through Tailscale (both install it and join the same tailnet). Default.
;   Direct    = over the internet with port forwarding: the host forwards UDP Port on their router (UPnP below
;               tries to do it automatically) and the guest puts the host's public IP in HostAddress.
;               Requires the same Secret on both PCs.
;   Steam     = through Steam's own networking (peer-to-peer with Valve's relays as fallback, encrypted). No VPN,
;               no port forwarding, no addresses: with PartnerSteamID = Auto you find each other automatically if
;               you're Steam friends (one Host, one Guest). Both need Steam running.
Network = Tailscale

; Guest, Tailscale or Direct: the host's address (Tailscale IP 100.x, or the public IP / hostname for Direct).
HostAddress = PUT-THE-HOSTS-TAILSCALE-IP-HERE

; Steam: Auto = your Steam friend who is playing with Phantom Pact in the other role; or their SteamID64
; (17 digits, starts with 7656119) to pick one person.
PartnerSteamID = Auto

; Direct, host: ask the router to forward the port automatically (UPnP). Off = forward UDP Port by hand.
UPnP = On

; UDP port. Both players must use the same one.
Port = 47800

; Shared secret (recommended): any long phrase, the SAME on both PCs. Every packet is then signed, so nobody else
; can join or send fake events even if they can reach your port. Leave the placeholder to turn signing off.
Secret = PUT-A-SHARED-SECRET-HERE

; Co-op difficulty (Elden Ring style): while your partner is with you, enemies and bosses have this much
; health and posture, in percent. 100 = normal. Both players should use the same numbers.
CoopEnemyHealth = 150
CoopEnemyPosture = 130

; Shared progress: On = quests you complete, bells you ring, enemy-group rewards you take, challenge points
; (Banyan Heart, Dragon Pillar, Scarecrow), codex entries, chests you open and rubbish piles you break during the
; session are applied in your partner's world too (and theirs in yours), through the game's own functions. A chest
; keeps its contents for whoever opened it. Chests show open at once; to record them in your save as well, run
; "pbzsave coop-sync" with the game closed (it reads shared_world.txt in this folder). Off = each player keeps
; their own progress.
ShareProgress = On
; Also send codex entries you discover (receiving your partner's always works). Off until it is verified in game.
ShareCodex = Off

; Relay: Auto = the native relay (relay\pbzcoop_relay.exe, no Python needed) when it's installed, else the Python
; relay. Native or Python to force one. Both work together, so you and your partner may use different ones.
Relay = Auto

; PvP: On = you and your partner can fight each other (duels: reaching 1 health loses the round, nobody dies).
; Both players must set it. PvPDamage scales the damage you take from your partner (100 = normal).
; PvPParryPosture: posture an attacker loses when you parry them (they also stagger).
PvP = Off
PvPDamage = 100
PvPParryPosture = 60
