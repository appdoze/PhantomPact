; Phantom Pact settings. Open in Notepad, change, save, then start the game.

; Host  = your world: your partner joins you.
; Guest = you join the host.
; Off   = Phantom Pact stays off (single-player as normal).
Role = Guest

; Guest only: the host's Tailscale IP (starts with 100.; the host sees it in the Tailscale app).
HostAddress = PUT-THE-HOSTS-TAILSCALE-IP-HERE

; UDP port. Both players must use the same one.
Port = 47800
