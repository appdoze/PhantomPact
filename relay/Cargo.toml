[package]
name = "pbzcoop-relay"
version = "1.3.0"
edition = "2021"
description = "Phantom Pact network relay (native build of net/pbzcoop_net.py; same protocol and files)"
license = "MIT"
publish = false

[[bin]]
name = "pbzcoop_relay"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
getrandom = "0.2"
hmac = "0.12"
libloading = "0.8"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# Compile-checks the mod's Lua (Lua 5.4, as UE4SS uses) in cargo test.
mlua = { version = "0.9", features = ["lua54", "vendored"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
