name: tests

on:
  push:
  pull_request:

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only: nothing to install. The Steam test needs a running Steam client and is skipped here.
      - run: python -I net/test_pbzcoop_net.py
