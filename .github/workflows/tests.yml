# Relay tests on every push and pull request (Python stdlib only; the Steam tests use a fake link, and only the
# Python relay has them: the C++ Steam link needs a running game).
# Read-only token, actions pinned by commit. (CI idea from appdoze's PR #2.)
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -I net/test_pbzcoop_net.py

  # Fork extras: the fork's Lua modules run against stand-ins for the game, and every mod script is compiled as
  # Lua 5.4 (luatest/). Rust comes preinstalled on GitHub's runners.
  fork-lua:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: cargo test --release --manifest-path luatest/Cargo.toml

  # The C++ relay against itself, then against the Python one each way round.
  native-relay:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        roles: ["host,client", "host", "client"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: .\tools\build-native.ps1
        shell: pwsh
      - run: python -I net/test_pbzcoop_net.py RelayLoopback SecretLoopback NativeRelay
        env:
          PBZCOOP_NATIVE_RELAY: native\build\relay_cli.exe
          PBZCOOP_NATIVE_ROLES: ${{ matrix.roles }}
