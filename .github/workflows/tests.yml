# Relay tests on every push and pull request (Python stdlib only; the Steam tests use a fake link).
# Read-only token, actions pinned by commit. (CI idea from appdoze's PR #2.)
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -I net/test_pbzcoop_net.py

  # Fork extras: the fork's Lua modules run against stand-ins for the game, and every mod script is compiled as
  # Lua 5.4 (luatest/). Rust comes preinstalled on GitHub's runners.
  fork-lua:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: cargo test --release --manifest-path luatest/Cargo.toml
