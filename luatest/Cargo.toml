[package]
name = "pbzcoop-luatest"
version = "0.1.0"
edition = "2021"
description = "Runs the mod's Lua outside the game: every script compiles as Lua 5.4, and the fork's logic against stand-ins"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Lua 5.4, as UE4SS embeds it.
mlua = { version = "0.9", features = ["lua54", "vendored"] }
